apiVersion: apps/v1
kind: Deployment
metadata:
  name: ab-testing-app
  namespace: ai-team
  labels:
    app: ab-testing-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ab-testing-app
  template:
    metadata:
      labels:
        app: ab-testing-app
    spec:
      imagePullSecrets:
        - name: acr-afas-secret
      containers:
        - name: ab-testing
          image: afassoftware.azurecr.io/ab-testing-ai:latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: DATA_DIR
              value: "/app/data"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ab-testing-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ab-testing-data
  namespace: ai-team
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ab-testing-app
  namespace: ai-team
  labels:
    app: ab-testing-app
spec:
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: ab-testing-app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ab-testing-app
  namespace: ai-team
spec:
  ingressClassName: nginx
  rules:
    - host: ab-testing-app.dev.k8s.ad.afas.nl
      http:
        paths:
          - backend:
              service:
                name: ab-testing-app
                port:
                  number: 5000
            path: /
            pathType: Prefix
